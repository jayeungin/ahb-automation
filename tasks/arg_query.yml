---
# Runs an Azure Resource Graph query one page at a time, recursing until every page is fetched.
# Inputs:
#   arg_query        - KQL query (must project the 'id' column, required by ARG paging)
#   arg_result_var   - name of the fact to append results to
#   arg_skip_token   - paging token; pass '' on the first call
- name: "Query Azure Resource Graph ({{ arg_result_var }})"
  ansible.builtin.command:
    argv: >-
      {{ ['az', 'graph', 'query', '-q', arg_query, '--first', '1000', '-o', 'json']
         + (['--management-groups', management_group_id] if management_group_id | default('') else [])
         + (['--skip-token', arg_skip_token] if arg_skip_token | default('') else []) }}
  register: arg_page_result
  changed_when: false

- name: "Accumulate results ({{ arg_result_var }})"
  ansible.builtin.set_fact:
    "{{ arg_result_var }}": "{{ (vars[arg_result_var] | default([])) + (arg_page_result.stdout | from_json).data }}"
    arg_next_token: "{{ (arg_page_result.stdout | from_json).skip_token | default('', true) }}"

- name: "Fetch next page ({{ arg_result_var }})"
  ansible.builtin.include_tasks: arg_query.yml
  vars:
    arg_skip_token: "{{ arg_next_token }}"
  when: arg_next_token | length > 0
